<script src="frontend/js/config.js"></script>
<script src="frontend/js/inputHelpers.js"></script>
<script src="frontend/js/apiClient.js"></script>
<script>
    const ALLOWED_POS_ROLES = ['cashier', 'store_manager', 'customer_admin'];

    let urunler = [];
    let sepet = [];
    let sonSatis = null;
    let lastCartHighlightId = null;
    let silmeModu = false;
    let faturaModu = false;
    const NORMAL_BARCODE_PLACEHOLDER = 'ürün barkodu';
    const SILME_BARCODE_PLACEHOLDER = 'Silinecek ürün barkodunu okutun';

    function openModal(el) {
      InputHelpers.setModalOpen(el, true);
    }

    function closeModalEl(el) {
      InputHelpers.setModalOpen(el, false);
    }

    function handleLogout() {
      if (confirm('Çıkış yapmak istediğinize emin misiniz?')) {
        ApiClient.logout();
      }
    }

    function generateClientSaleId() {
      if (window.crypto && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }

      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : ((r & 0x3) | 0x8);
        return v.toString(16);
      });
    }

    function getApiFilters() {
      const user = ApiClient.getCurrentUser();
      const filters = {};
      const urlStoreId = new URLSearchParams(window.location.search).get('store_id');

      if (user && user.store_id) {
        filters.store_id = user.store_id;
      } else if (urlStoreId) {
        filters.store_id = urlStoreId;
      } else {
        const savedStoreId = localStorage.getItem('pos_store_id');
        if (savedStoreId) {
          filters.store_id = savedStoreId;
        }
      }

      return filters;
    }

    function normalizeApiProduct(product) {
      return {
        id: product.id,
        barkod: product.barcode,
        barcode: product.barcode,
        aciklama: product.name,
        name: product.name,
        fiyat: Number(product.sale_price),
        sale_price: Number(product.sale_price),
        alis_fiyati: Number(product.purchase_price || 0),
        purchase_price: Number(product.purchase_price || 0),
        birim: product.unit || 'Adet',
        unit: product.unit || 'Adet',
        tip: product.product_type || 'A',
        product_type: product.product_type || 'A',
        kdv: Number(product.vat_rate || 0),
        vat_rate: Number(product.vat_rate || 0),
        kategori: product.category || '',
        category: product.category || '',
        stok_miktari: Number(product.stock_quantity || 0),
        stock_quantity: Number(product.stock_quantity || 0),
      };
    }

    function mapApiError(error, fallback) {
      if (ApiClient.isSessionExpiredError(error)) {
        return null;
      }

      const message = (error && error.message) ? error.message : '';

      if (
        message.includes('Failed to fetch') ||
        message.includes('NetworkError') ||
        message.includes('Network request failed')
      ) {
        return 'Sunucuya bağlanılamadı';
      }

      if (message.includes('Yetersiz stok')) {
        return message;
      }

      if (message.includes('Yetkiniz yok') || message.includes('Oturum')) {
        return message;
      }

      return message || fallback;
    }

    function collectYeniUrunFormData() {
      const alisRaw = document.getElementById('yeniAlis').value.trim();
      const fiyatRaw = document.getElementById('yeniFiyat').value.trim();
      const kdvRaw = document.getElementById('yeniKdv').value.trim();
      const stokRaw = document.getElementById('yeniStok').value.trim();
      const birimRaw = document.getElementById('yeniBirim').value.trim();
      const tipRaw = document.getElementById('yeniTur').value.trim();
      const kategoriRaw = document.getElementById('yeniKategori').value.trim();

      return {
        barkod: document.getElementById('yeniBarkod').value.trim(),
        aciklama: document.getElementById('yeniAciklama').value.trim(),
        alis_fiyati: alisRaw === '' ? 0 : (parseFloat(alisRaw) || 0),
        fiyat: fiyatRaw === '' ? NaN : parseFloat(fiyatRaw),
        birim: birimRaw || 'Adet',
        tip: tipRaw || 'A',
        kdv: kdvRaw === '' ? 20 : (parseFloat(kdvRaw) || 20),
        kategori: kategoriRaw || 'Genel',
        stok_miktari: stokRaw === '' ? 0 : (parseInt(stokRaw, 10) || 0),
      };
    }

    function validateYeniUrunFormData(formData) {
      if (!formData.barkod) {
        alert('Barkod zorunludur.');
        document.getElementById('yeniBarkod').focus();
        return false;
      }

      if (!formData.aciklama) {
        alert('Ürün adı / açıklama zorunludur.');
        document.getElementById('yeniAciklama').focus();
        return false;
      }

      if (Number.isNaN(formData.fiyat) || formData.fiyat < 0) {
        alert('Geçerli bir satış fiyatı girin.');
        document.getElementById('yeniFiyat').focus();
        return false;

    function yeniUrunFormToApiPayload(formData) {
      const payload = {
        barcode: formData.barkod,
        name: formData.aciklama,
        purchase_price: formData.alis_fiyati,
        sale_price: formData.fiyat,
        unit: formData.birim,
        product_type: formData.tip,
        vat_rate: formData.kdv,
        category: formData.kategori,
        stock_quantity: formData.stok_miktari,
      };

      const filters = getApiFilters();
      if (filters.store_id) {
        payload.store_id = filters.store_id;
      }

      return payload;
    }

    function setupYeniUrunFormEnterNavigation(form) {
      const fields = Array.from(form.querySelectorAll('input.yeni-urun-form-field'));

      fields.forEach(function (field, index) {
        field.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') {
            return;
          }

          e.preventDefault();
          e.stopPropagation();

          if (index < fields.length - 1) {
            fields[index + 1].focus();
            if (typeof fields[index + 1].select === 'function') {
              fields[index + 1].select();
            }
            return;
          }

          const formData = collectYeniUrunFormData();
          if (validateYeniUrunFormData(formData)) {
            form.requestSubmit();
          }
        });
      });
    }

    function parseBarkodOnly(barkodGiris) {
      let barkod = String(barkodGiris || '').trim();

      if (/^\d+\*\S+/.test(barkod)) {
        barkod = barkod.split('*').slice(1).join('*').trim();
      }

      return barkod;
    }

    function barkodIsle(barkodGiris) {
      const barkod = parseBarkodOnly(barkodGiris);

      if (!barkod) {
        alert('Barkod boş olamaz!');
        return;
      }

      if (silmeModu) {
        urunSilBarkodla(barkod);
        return;
      }

      urunEkle(barkodGiris);
    }

    function urunSilBarkodla(barkod) {
      const urun = sepetUrunBulBarkod(barkod);

      if (!urun) {
        alert('Bu ürün sepette yok');
        input.value = '';
        return;
      }

      const silinecekAdet = getSilinecekAdet();
      const yeniAdet = (urun.adet || 1) - silinecekAdet;

      if (yeniAdet <= 0) {
        sepettenUrunSil(urun.id);
      } else {
        urun.adet = yeniAdet;
        tabloyuGuncelle();
      }

      input.value = '';
    }

    function handleEscAction() {
      if (silmeModu) {
        kapatSilmeModu();
        return;
      }

      sepetiTemizle();
    }

    function sepetUrunBul(productId) {
      return sepet.find(function (u) {
        return String(u.id) === String(productId);
      });
    }

    function formatFiyatSutunu(urun) {
      const adet = urun.adet || 1;
      if (adet <= 1) {
        return urun.fiyat.toFixed(2) + ' ₺';
      }
      return adet + ' x ' + urun.fiyat.toFixed(2) + ' ₺';
    }

    function sepettenUrunSil(productId) {
      sepet = sepet.filter(function (u) {
        return String(u.id) !== String(productId);
      });
      tabloyuGuncelle();
    }

    function sepetAdetDegistir(productId, delta) {
      const urun = sepetUrunBul(productId);
      if (!urun) {
        return;
      }

      urun.adet = (urun.adet || 1) + delta;

      if (urun.adet <= 0) {
        sepettenUrunSil(productId);
        return;
      }

      tabloyuGuncelle();
    }

    function sepetAdetArtir(productId) {
      sepetAdetDegistir(productId, 1);
    }

    function sepetAdetAzalt(productId) {
      sepetAdetDegistir(productId, -1);
    }

    function sepeteEkle(urun, adet) {
      const sepetteki = sepetUrunBul(urun.id);
      if (sepetteki) {
        sepetteki.adet += adet;
      } else {
        sepet.push(Object.assign({}, urun, { adet: adet }));
      }

      lastCartHighlightId = urun.id;

      const ses = document.getElementById('okumaSesi');
      if (ses) {
        ses.play().catch(function () {});
      }

      tabloyuGuncelle();
    }

    async function urunEkle(barkodGiris) {
      let adet = 1;
      let barkod = barkodGiris;

      if (/^\d+\*\w+/.test(barkodGiris)) {
        const parts = barkodGiris.split('*');
        adet = parseInt(parts[0], 10) || 1;
        barkod = parts.slice(1).join('*');
        if (!barkod) {
          alert('Barkod formatı yanlış! Örnek: 3*12345');
          return;
        }
      }

      if (!barkod) {
        alert('Barkod boş olamaz!');
        return;
      }

      try {
        const product = await ApiClient.getProductByBarcode(barkod, getApiFilters());
        sepeteEkle(normalizeApiProduct(product), adet);
      } catch (error) {
        const message = error.message || '';

        if (message.includes('bulunamadı') || message.includes('404')) {
          document.getElementById('yeniBarkod').value = barkod;
          openModal(document.getElementById('urunEkleModal'));
          return;
        }

        const barcodeError = mapApiError(error, 'Ürün aranırken hata oluştu');
        if (barcodeError) {
          alert(barcodeError);
        }
      }
    }

    const input = document.getElementById('barcodeInput');
    const verilenNakitInput = document.getElementById('verilenNakit');
    const buttons = document.querySelectorAll('.manuelbarkodgiriş button');
    const satisBody = document.getElementById('satisBody');

    satisBody.addEventListener('click', function (e) {
      const btn = e.target.closest('button[data-cart-action]');
      if (!btn) {
        return;
      }

      e.stopPropagation();
      const productId = btn.getAttribute('data-product-id');
      const action = btn.getAttribute('data-cart-action');

      if (action === 'remove') {
        sepettenUrunSil(productId);
      } else if (action === 'inc') {
        sepetAdetArtir(productId);
      } else if (action === 'dec') {
        sepetAdetAzalt(productId);
      }
    });

    document.addEventListener('keydown', function (e) {
      const active = document.activeElement;
      const fiyatModal = document.getElementById('fiyatPanel');
      const urunModal = document.getElementById('urunEkleModal');
      const faturaModal = document.getElementById('faturaMusteriModal');

      if (InputHelpers.isModalOpen(urunModal)) {
        if (e.key === 'Escape') {
          kapatModal();
          return;
        }
        return;
      }

      if (InputHelpers.isModalOpen(fiyatModal)) {
        if (e.key === 'Escape') {
          kapatFiyatPanel();
          return;
        }
        if (e.key === 'Enter' && active && active.id === 'fiyatBarkodInput') {
          e.preventDefault();
          fiyatSorgula();
        }
        return;
      }

      if (InputHelpers.isModalOpen(faturaModal)) {
        if (e.key === 'Escape') {
          kapatFaturaMusteriModal();
          return;
        }
        return;
      }

      if (e.key === 'F5') {
        e.preventDefault();
        toggleFaturaModu();
        return;
      }

      if (e.key === 'F8') {
        e.preventDefault();
        toggleSilmeModu();
        return;
      }

      if (e.key === 'Escape' && silmeModu) {
        e.preventDefault();
        kapatSilmeModu();
        return;
      }

      if (InputHelpers.shouldIgnoreShortcut(e)) {
        if (e.key === 'Enter' && active === input) {
          const barkod = input.value.trim();
          barkodIsle(barkod);
          input.value = '';
        }
        return;
      }

      if (e.key === 'F12') {
        e.preventDefault();
        fisYazdir();
        return;
      }

      if (e.key === 'Enter' && active === input) {
        const barkod = input.value.trim();
        barkodIsle(barkod);
        input.value = '';
        return;
      }

      if (e.key === 'F6') {
        e.preventDefault();
        window.location.href = 'admin.paneli.html#urun';
      } else if (e.key === 'F1') {
        e.preventDefault();
        sepetiTemizle();
      } else if (e.key === 'F2') {
        e.preventDefault();
        fiyatGor();
      } else if (e.key === 'F7') {
        e.preventDefault();
        window.location.href = 'admin.paneli.html';
      } else if (e.key === 'Escape') {
        e.preventDefault();
        handleEscAction();
      }
    });

    buttons.forEach(function (button) {
      button.addEventListener('mousedown', function (e) {
        e.preventDefault();
        e.stopPropagation();
      });

      button.addEventListener('click', function (e) {
        e.stopPropagation();
        const value = button.textContent.toLowerCase();
        const active = document.activeElement;
        let target = input;

        if (active === input || active === verilenNakitInput) {
          target = active;
        }

        if (value === 'sil') {
          if (active === input || active === verilenNakitInput) {
            target.value = target.value.slice(0, -1);
          }
        } else if (value === 'enter') {
          if (target === input) {
            const barkod = input.value.trim();
            barkodIsle(barkod);
            input.value = '';
          }
        } else {
          target.value += value;
        }

        if (target === verilenNakitInput) {
          hesaplaParaUstu();
        }
      });
    });

    const yeniUrunForm = document.getElementById('yeniUrunForm');
    setupYeniUrunFormEnterNavigation(yeniUrunForm);

    yeniUrunForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!ApiClient.isLoggedIn()) {
        ApiClient.requireAuth();
        return;
      }

      const formData = collectYeniUrunFormData();
      if (!validateYeniUrunFormData(formData)) {
        return;
      }

      const payload = yeniUrunFormToApiPayload(formData);

      try {
        const data = await ApiClient.createProduct(payload);
        const eklenenUrun = normalizeApiProduct(data.product || data);

        urunler.push(eklenenUrun);
        sepeteEkle(eklenenUrun, 1);

        kapatModal();
        this.reset();
      } catch (error) {
        const createError = mapApiError(error, 'Ürün eklenirken hata oluştu');
        if (createError) {
          alert(createError);
        }
      }
    });

      closeModalEl(document.getElementById('urunEkleModal'));
      document.getElementById('yeniUrunForm').reset();
    }

    function sepetiTemizle() {
      sepet = [];
      tabloyuGuncelle();
      odaklaBarkodInput();
    }

    const paraUstuSpan = document.getElementById('paraUstu');
    const toplamTutarSpan = document.getElementById('toplamTutar');

    function hesaplaParaUstu() {
      const verilen = parseFloat(verilenNakitInput.value) || 0;
      const toplam = parseFloat(toplamTutarSpan.innerText.replace('₺', '').replace(',', '.')) || 0;
      const paraUstu = verilen - toplam;
      paraUstuSpan.innerText = (paraUstu > 0 ? paraUstu.toFixed(2) : '0.00') + ' ₺';
    }

    verilenNakitInput.addEventListener('input', hesaplaParaUstu);

    function odaklaBarkodInput() {
      const barkodInput = document.getElementById('barcodeInput');
      const urunModal = document.getElementById('urunEkleModal');
      const fiyatPanel = document.getElementById('fiyatPanel');

      if (
        barkodInput &&
        !InputHelpers.isModalOpen(urunModal) &&
        !InputHelpers.isModalOpen(fiyatPanel) &&
        !InputHelpers.isModalOpen(document.getElementById('faturaMusteriModal'))
      ) {
        InputHelpers.focusBarcode(barkodInput, 'odaklaBarkodInput');
      }
    }

    function tabloyuGuncelle() {
      const tbody = satisBody;
      let toplam = 0;
      tbody.innerHTML = '';

      sepet.forEach(function (urun) {
        const adet = urun.adet || 1;
        const satirToplam = urun.fiyat * adet;
        toplam += satirToplam;

        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + urun.barkod + '</td>' +
          '<td>' + urun.aciklama + '</td>' +
          '<td>' + (urun.birim || 'Adet') + '</td>' +
          '<td>' + (urun.tip || 'A') + '</td>' +
          '<td>' + formatFiyatSutunu(urun) + '</td>' +
          '<td>' + satirToplam.toFixed(2) + ' ₺</td>' +
          '<td class="sepet-islem">' +
            '<button type="button" class="sepet-adet-btn" data-cart-action="dec" data-product-id="' + urun.id + '">-</button>' +
            '<span class="sepet-adet">' + adet + '</span>' +
            '<button type="button" class="sepet-adet-btn" data-cart-action="inc" data-product-id="' + urun.id + '">+</button>' +
            '<button type="button" class="sepet-sil-btn" data-cart-action="remove" data-product-id="' + urun.id + '">Sil</button>' +
          '</td>';

        if (lastCartHighlightId && String(urun.id) === String(lastCartHighlightId)) {
          tr.classList.add('yeni-eklenen');
          setTimeout(function () {
            tr.classList.remove('yeni-eklenen');
          }, 1000);
        }

        tbody.appendChild(tr);
      });

      lastCartHighlightId = null;
      document.getElementById('cesitSayisi').innerText = sepet.length;
      document.getElementById('toplamTutar').innerText = toplam.toFixed(2) + ' ₺';
      hesaplaParaUstu();
    }

    function fiyatGor() {
      const panel = document.getElementById('fiyatPanel');
      openModal(panel);

      const fiyatInput = document.getElementById('fiyatBarkodInput');
      fiyatInput.value = '';
      document.getElementById('fiyatSonucu').innerText = '';
    }

    async function fiyatSorgula() {
      const barkod = document.getElementById('fiyatBarkodInput').value.trim();
      const sonuc = document.getElementById('fiyatSonucu');

      if (!barkod) {
        sonuc.innerText = 'Barkod giriniz.';
        return;
      }

      try {
        const product = await ApiClient.getProductByBarcode(barkod, getApiFilters());
        const urun = normalizeApiProduct(product);
        sonuc.innerText = urun.aciklama + ' → ' + urun.fiyat.toFixed(2) + ' ₺';
      } catch (error) {
        const priceError = mapApiError(error, 'Ürün bulunamadı.');
        if (priceError) {
          sonuc.innerText = priceError;
        }
      }
    }

    function kapatFiyatPanel() {
      closeModalEl(document.getElementById('fiyatPanel'));
    }

    async function satisKaydet(invoiceCustomer, isInvoice) {
      if (sepet.length === 0) {
        alert('Sepette ürün bulunmuyor!');
        return null;
      }

      if (!ApiClient.isLoggedIn()) {
        ApiClient.requireAuth();
        return null;
      }

      const saleBody = {
        items: sepet.map(function (urun) {
          return {
            product_id: urun.id,
            quantity: urun.adet || 1,
          };
        }),
        cash_received: parseFloat(verilenNakitInput.value) || null,
        client_sale_id: generateClientSaleId(),
      };

      if (isInvoice && invoiceCustomer) {
        saleBody.invoice_mode = true;
        saleBody.invoice_customer = invoiceCustomer;
      }

      const filters = getApiFilters();
      if (filters.store_id) {
        saleBody.store_id = filters.store_id;
      }

      try {
        const data = await ApiClient.createSale(saleBody);
        sonSatis = data.sale || null;

        const receiptNo = sonSatis ? sonSatis.receipt_no : '-';
        const totalAmount = sonSatis ? Number(sonSatis.total_amount).toFixed(2) : '0.00';
        const changeAmount = sonSatis && sonSatis.change_amount !== null
          ? Number(sonSatis.change_amount).toFixed(2)
          : null;

        const kayitTipi = isInvoice ? 'Fatura satışı' : 'Satış';
        alert(
          kayitTipi + ' başarıyla kaydedildi!\n' +
          (isInvoice ? 'Fatura No: ' : 'Fiş No: ') + receiptNo + '\n' +
          'Toplam: ' + totalAmount + ' ₺' +
          (changeAmount !== null ? '\nPara Üstü: ' + changeAmount + ' ₺' : '')
        );

        sepetiTemizle();
        await loadUrunler();

        return data;
      } catch (error) {
        const saleError = mapApiError(error, 'Satış kaydedilirken hata oluştu');
        if (saleError) {
          alert(saleError);
        }
        return null;
      }
    }

    async function fisYazdir() {
      if (sepet.length === 0) {
        alert('Sepette ürün bulunmuyor!');
        return;
      }

      if (faturaModu) {
        acFaturaMusteriModal();
        return;
      }

      await tamamlaVeYazdir(null, false);
    }

    document.querySelector('.f12-btn').addEventListener('click', fisYazdir);
    document.querySelector('.esc-btn').addEventListener('click', handleEscAction);

    window.addEventListener('load', async function () {
      if (!initAuth()) {
        return;
      }
      InputHelpers.init();
      await loadUrunler();
      odaklaBarkodInput();
    });
  </script>
    </body>
</html>
